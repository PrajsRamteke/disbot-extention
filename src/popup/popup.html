<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="color-picker-section">
            <h1 class="title">Color Picker</h1>

            <!-- Color Wheel -->
            <div class="color-wheel-container">
                <div class="color-wheel" id="colorWheel">
                    <input type="color" id="colorPicker" value="#667eea">
                </div>
            </div>

            <!-- Transparency Slider -->
            <div class="slider-container">
                <div class="slider-track" id="sliderTrack">
                    <input type="range" id="opacitySlider" min="0" max="100" value="100">
                </div>
            </div>

            <!-- Color Values -->
            <div class="color-values">
                <div class="value-box">
                    <div class="value-display" id="hexValue">667eea</div>
                    <div class="value-label">#</div>
                </div>
                <div class="value-box">
                    <div class="value-display" id="rValue">102</div>
                    <div class="value-label">R</div>
                </div>
                <div class="value-box">
                    <div class="value-display" id="gValue">126</div>
                    <div class="value-label">G</div>
                </div>
                <div class="value-box">
                    <div class="value-display" id="bValue">234</div>
                    <div class="value-label">B</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-row">
                <button id="eyedropperButton" class="btn-action">pick</button>
                <button id="copyButton" class="btn-action">copy</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
